    <style>
      /*body*/

      body {
        font-family: sans-serif;
        margin: 0;
      }

      .content {
        margin-top: 130px;
        padding-bottom: 20px;
      }
      @media only screen and (max-width: 600px) {
        .content {
          margin-top: 100px;
        }
      }
      @media only screen and (max-width: 600px) {
        .content {
          padding: 20px 16px;
        }
      }

      .wrapper {
        position: relative;
        min-height: 100%;
        height: auto !important;
        height: 100%;
      }

      /*navbar*/

      nav ul {
        overflow: hidden;
        background-color: #333;
        padding: 40px 10px;
        position: fixed;
        width: 100%;
        top: 0px;
        list-style-type: none;
        left: 0;
        margin: 0;
        transition: 0.4s;
        z-index: 99;
      }
      @media only screen and (max-width: 600px) {
        nav ul {
          padding: 20px 10px;
        }
      }

      nav ul a {
        float: left;
        text-align: center;
        padding: 12px;
        text-decoration: none;
        font-size: 18px;
        line-height: 20px;
        border-radius: 4px;
        color: #f2f2f2;
      }
      @media screen and (max-width: 600px) {
        nav a:not(:first-child) {
          display: none;
        }
        nav ul a {
          float: none;
        }
      }

      nav ul a:hover {
        background-color: #ddd;
        color: black;
      }

      nav ul a.active {
        background-color: #717171;
        color: white;
      }

      .icon {
        display: none;
      }
      @media screen and (max-width: 600px) {
        .icon {
          right: 10;
          display: block;
        }
      }

      .logo {
        font-size: 35px;
        transition: 0.4s;
      }
      @media only screen and (max-width: 600px) {
        .logo {
          font-size: 25px;
        }
      }

      @media screen and (max-width: 600px) {
        .navbar.responsive {
          position: relative;
          padding: 20px 10px;
        }
        .navbar.responsive .icon {
          position: absolute;
          right: 10px;
          top: 20px;
        }
        .navbar.responsive a {
          float: none;
          display: block;
          text-align: left;
        }
        .content.responsive {
          margin-top: 0px;
        }
      }

      /*footer*/

      .footer {
        padding: 16px;
        width: 100%;
        background-color: #333;
        text-align: center;
        list-style-type: none;
        position: absolute;
        bottom: 0px;
      }

      .footer li a {
        color: white;
        text-decoration: none;
      }

      /*button*/

      .btn {
        border: none;
        text-align: center;
        border-radius: 4px;
        display: inline-block;
        background-color: #eee;
        padding: 14px;
      }
      @media only screen and (max-width: 600px) {
        .category.responsive .btn {
          margin-top: 10px;
          font-size: 10px;
          padding: 5px;
          float: left;
          width: 100%;
        }
      }
      @media only screen and (max-width: 600px) {
        .category .btn {
          display: none;
        }
      }

      .btn:hover {
        background: #ccc;
      }

      .btn.active {
        background-color: #919191;
        color: white;
      }

      .btnnav {
        display: none;
      }
      @media only screen and (max-width: 600px) {
        .btnnav {
          background: #eee;
          width: 100%;
          font-size: 10px;
          display: inline-block;
          padding: 5px;
          border: 1px solid #717171;
        }
      }

      .btnnav.active {
        background-color: #919191;
        color: white;
      }

      /*Image--*/

      .container {
        display: none;
        position: fixed;
        z-index: 1;
        padding-top: 100px;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: black;
      }

      .container .icon {
        right: 0;
        top: 0;
        font-size: 100px;
        display: block;
        color: white;
        float: right;
      }

      .simpleSlides {
        text-align: center;
        position: relative;
        max-width: 1000px;
        vertical-align: middle;
        display: table-cell;
      }
      @media only screen and (max-width: 600px) {
        .btn {
          width: 100%;
        }
      }

      .slides {
        display: none;
        width: 100%;
      }

      .animate-left {
        position: relative;
        animation: animateleft 0.8s;
      }

      @keyframes animateleft {
        from {
          left: -500px;
          opacity: 0;
        }
        to {
          left: 0;
          opacity: 1;
        }
      }

      /*Image-container*/

      .grid {
        width: 100%;
        position: relative;
        max-width: 1500px;
        margin: auto;
        display: table;
      }
      @media only screen and (max-width: 600px) {
        .grid {
          max-width: "";
        }
      }

      /* .item rules removed (no properties) */

      .item li {
        list-style: none;
        float: left;
        width: 30%;
        margin: 1.5%;
      }
      @media only screen and (max-width: 600px) {
        .item li {
          width: 45%;
          margin: 1%;
        }
      }

      .img {
        width: 100%;
        filter: brightness(100%);
      }
    </style>
  </head>

    <!--navbar-->

    <script>
      const mq = window.matchMedia("(min-width: 600px)");
      window.onscroll = function () {
        scrollFunction();
      };
      function scrollFunction() {
        if (mq.matches) {
          if (
            document.body.scrollTop > 80 ||
            document.documentElement.scrollTop > 80
          ) {
            document.getElementById("navbar").style.padding = "20px 10px";
            document.getElementById("logo").style.fontSize = "25px";
          } else {
            document.getElementById("navbar").style.padding = "40px 10px";
            document.getElementById("logo").style.fontSize = "35px";
          }
        } else {
          document.getElementById("navbar").style.padding = "20px 10px";
          document.getElementById("logo").style.fontSize = "25px";
        }
      }

      if (matchMedia) {
        const mq = window.matchMedia("(min-width: 600px)");
        mq.addListener(WidthChange);
        WidthChange(mq);
      }
    </script>

    <script>
      function myFunction() {
        var x = document.getElementById("navbar"),
          v = document.getElementById("content");
        if (x.className === "navbar") {
          x.className += " responsive";
          v.className += " responsive";
        } else {
          x.className = "navbar";
          v.className = "content";
        }
      }

      function resButton() {
        var x = document.getElementById("category");
        if (x.className === "category") {
          x.className += " responsive";
        } else {
          x.className = "category";
        }
      }
    </script>

    <!--Image-->

    <script>
      var slideIndex = 1;

      function closeImg() {
        document.getElementById("container").style.display = "none";
        document.getElementById("navbar").style.display = "block";
      }

      function currentSlide(n) {
        var x = document.getElementById("simpleSlides");
        showSlides((slideIndex = n));
        document.getElementById("container").style.display = "block";
        document.getElementById("navbar").style.display = "none";
      }

      function showSlides(n) {
        var aimg = document.getElementsByClassName("active");
        var x = document.getElementById("simpleSlides");
        var i;
        var slides = document.getElementsByClassName("slides");
        if (n > slides.length) {
          slideIndex = 1;
        }
        if (n < 1) {
          slideIndex = slides.length;
        }
        for (i = 0; i < slides.length; i++) {
          slides[i].style.display = "none";
        }
        slides[slideIndex - 1].style.display = "block";
      }
    </script>

    <!--Filter-->

    <script>
      var btns = document.getElementsByClassName("btn");
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener("click", function () {
          var current = document.getElementsByClassName("active");
          current[1].className = current[1].className.replace(" active", " ");
          this.className += " active";
        });
      }

      var btns = document.getElementsByClassName("btnnav");
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener("click", function () {
          var current = document.getElementsByClassName("active");
          current[1].className = current[1].className.replace(" active", " ");
          this.className += " active";
        });
      }
    </script>
