# Prevent clickjacking attacks
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME-sniffing
add_header X-Content-Type-Options "nosniff" always;

# Modern Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self' https://www.google.com https://www.google.de https://maps.google.com https://maps.google.de https://*.googleusercontent.com http://googleusercontent.com; form-action 'self' https://formspree.io;" always;

# Note: X-XSS-Protection is intentionally omitted as it is deprecated in modern browsers.